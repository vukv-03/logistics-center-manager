services:

  mysql:
    image: docker.io/library/mysql:8.4
    container_name: lcm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal

  backend:
    build:
      context: ./backend
    image: localhost/lcm-backend
    container_name: lcm-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
    image: localhost/lcm-frontend
    container_name: lcm-frontend
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: docker.io/library/nginx:alpine
    container_name: lcm-rev-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx_config/reverse_proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - external
      - internal

volumes:
  mysql_data:

networks:
  external:
    external: true
    name: external

  internal:
    external: true
    name: internal
